<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Upper Story — A Vertical World</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        /* Sky-toned so no dark band can show before the canvas sizes itself. */
        background: #b9d5e8;
      }
      #app {
        position: fixed;
        inset: 0;
        overflow: hidden;
      }
      #app canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
